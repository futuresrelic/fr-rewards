<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Purchase Management - Admin</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .controls-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .control-group label {
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--text-secondary);
    }

    .control-group select,
    .control-group input {
      padding: 10px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background: var(--bg-dark);
      color: var(--text-primary);
      font-size: 0.95rem;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 25px;
    }

    .stat-card {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      padding: 20px;
      border-radius: 8px;
      color: white;
      text-align: center;
    }

    .stat-value {
      font-size: 2rem;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .stat-label {
      font-size: 0.9rem;
      opacity: 0.9;
    }

    .purchase-card {
      background: var(--bg-dark);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 15px;
    }

    .purchase-card.failed {
      border-left: 4px solid var(--error);
    }

    .purchase-card.completed {
      border-left: 4px solid var(--success);
    }

    .purchase-card.pending {
      border-left: 4px solid var(--warning);
    }

    .purchase-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .purchase-status {
      display: inline-block;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .status-completed {
      background: rgba(16, 185, 129, 0.2);
      color: var(--success);
    }

    .status-failed {
      background: rgba(239, 68, 68, 0.2);
      color: var(--error);
    }

    .status-pending {
      background: rgba(251, 191, 36, 0.2);
      color: var(--warning);
    }

    .purchase-details {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 15px;
    }

    .detail-item {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .detail-label {
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    .detail-value {
      font-weight: 600;
      color: var(--text-primary);
      word-break: break-all;
    }

    .purchase-actions {
      display: flex;
      gap: 10px;
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid var(--border-color);
    }

    .error-message {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid var(--error);
      border-radius: 6px;
      padding: 12px;
      margin-top: 10px;
      font-size: 0.9rem;
      color: var(--error);
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      border-bottom: 2px solid var(--border-color);
    }

    .tab {
      padding: 12px 20px;
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 600;
      border-bottom: 3px solid transparent;
      transition: all 0.3s;
    }

    .tab:hover {
      color: var(--text-primary);
    }

    .tab.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }
  </style>
</head>
<body>
  <div class="admin-container">
    <!-- Header -->
    <div class="admin-header">
      <div>
        <h1>💰 Purchase Management</h1>
        <p style="color: var(--text-secondary); margin-top: 5px;">
          Manage NFT purchases and recover failed transactions
        </p>
      </div>
      <div>
        <a href="admin.html" class="btn btn-secondary">← Back to Admin</a>
      </div>
    </div>

    <!-- Admin Check -->
    <div id="adminCheck" style="text-align: center; padding: 40px;">
      <div class="loader"></div>
      <p>Checking admin access...</p>
    </div>

    <!-- Main Content (hidden until admin verified) -->
    <div id="mainContent" style="display: none;">
      <!-- Tabs -->
      <div class="tabs">
        <button class="tab active" data-tab="all">All Purchases</button>
        <button class="tab" data-tab="recovery">Needs Recovery</button>
      </div>

      <!-- All Purchases Tab -->
      <div id="tab-all" class="tab-content active">
        <!-- Stats -->
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-value" id="totalPurchases">0</div>
            <div class="stat-label">Total Purchases</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="completedPurchases">0</div>
            <div class="stat-label">Completed</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="failedPurchases">0</div>
            <div class="stat-label">Failed</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="pendingPurchases">0</div>
            <div class="stat-label">Pending</div>
          </div>
        </div>

        <!-- Controls -->
        <div class="controls-container">
          <div class="control-group">
            <label>Filter by Status</label>
            <select id="statusFilter">
              <option value="all">All</option>
              <option value="completed">Completed</option>
              <option value="failed">Failed</option>
              <option value="pending">Pending</option>
            </select>
          </div>
          <div class="control-group">
            <label>Search Wallet</label>
            <input type="text" id="walletSearch" placeholder="Enter wallet name...">
          </div>
          <div class="control-group">
            <label>&nbsp;</label>
            <button class="btn btn-primary" id="refreshBtn">🔄 Refresh</button>
          </div>
        </div>

        <!-- Purchases List -->
        <div id="purchasesList"></div>
      </div>

      <!-- Recovery Tab -->
      <div id="tab-recovery" class="tab-content">
        <div class="alert alert-warning" style="margin-bottom: 20px;">
          <strong>⚠️ Recovery Mode</strong><br>
          This view shows purchases that failed verification or minting and can be recovered.
        </div>

        <!-- Recovery Purchases List -->
        <div id="recoveryList"></div>
      </div>
    </div>
  </div>

  <script>
    const API_URL = window.location.origin;
    let allPurchases = [];

    // Check admin access
    async function checkAdmin() {
      try {
        const response = await fetch(`${API_URL}/api/admin/stats`);
        if (response.status === 401) {
          window.location.href = 'admin.html';
          return;
        }
        if (!response.ok) {
          throw new Error('Admin check failed');
        }

        document.getElementById('adminCheck').style.display = 'none';
        document.getElementById('mainContent').style.display = 'block';

        await loadPurchases();
      } catch (error) {
        console.error('Admin check error:', error);
        window.location.href = 'admin.html';
      }
    }

    // Tab switching
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        const tabName = tab.dataset.tab;

        // Update active tab
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');

        // Update active content
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.getElementById(`tab-${tabName}`).classList.add('active');

        // Load appropriate data
        if (tabName === 'recovery') {
          loadRecoveryPurchases();
        }
      });
    });

    // Load all purchases
    async function loadPurchases() {
      try {
        const response = await fetch(`${API_URL}/api/admin/purchases?limit=100`);
        if (!response.ok) throw new Error('Failed to load purchases');

        const data = await response.json();
        allPurchases = data.purchases || [];

        updateStats();
        displayPurchases(allPurchases);
      } catch (error) {
        console.error('Error loading purchases:', error);
        alert('Failed to load purchases: ' + error.message);
      }
    }

    // Load purchases needing recovery
    async function loadRecoveryPurchases() {
      try {
        const response = await fetch(`${API_URL}/api/admin/purchases/recovery?limit=50`);
        if (!response.ok) throw new Error('Failed to load recovery purchases');

        const data = await response.json();
        const purchases = data.purchases || [];

        const recoveryList = document.getElementById('recoveryList');
        if (purchases.length === 0) {
          recoveryList.innerHTML = '<div class="alert alert-info">No purchases need recovery at this time.</div>';
          return;
        }

        displayPurchases(purchases, 'recoveryList');
      } catch (error) {
        console.error('Error loading recovery purchases:', error);
        alert('Failed to load recovery purchases: ' + error.message);
      }
    }

    // Update statistics
    function updateStats() {
      const total = allPurchases.length;
      const completed = allPurchases.filter(p => p.status === 'completed').length;
      const failed = allPurchases.filter(p => p.status === 'failed').length;
      const pending = allPurchases.filter(p => p.status === 'pending').length;

      document.getElementById('totalPurchases').textContent = total;
      document.getElementById('completedPurchases').textContent = completed;
      document.getElementById('failedPurchases').textContent = failed;
      document.getElementById('pendingPurchases').textContent = pending;
    }

    // Display purchases
    function displayPurchases(purchases, targetElementId = 'purchasesList') {
      const container = document.getElementById(targetElementId);
      container.innerHTML = '';

      if (purchases.length === 0) {
        container.innerHTML = '<div class="alert alert-info">No purchases found.</div>';
        return;
      }

      purchases.forEach(purchase => {
        const card = document.createElement('div');
        card.className = `purchase-card ${purchase.status}`;

        const statusClass = `status-${purchase.status}`;
        const statusEmoji = purchase.status === 'completed' ? '✅' :
                           purchase.status === 'failed' ? '❌' : '⏳';

        const canRecover = (purchase.status === 'failed' || purchase.verification_status === 'verification_failed') &&
                          purchase.status !== 'completed';

        const errorMsg = purchase.error_message ? `
          <div class="error-message">
            <strong>Error:</strong> ${purchase.error_message}
          </div>
        ` : '';

        const mintLink = purchase.mint_transaction_id ? `
          <a href="https://waxblock.io/transaction/${purchase.mint_transaction_id}" target="_blank" class="btn btn-sm btn-secondary">
            View Mint TX
          </a>
        ` : '';

        const paymentLink = `
          <a href="https://waxblock.io/transaction/${purchase.payment_transaction_id}" target="_blank" class="btn btn-sm btn-secondary">
            View Payment TX
          </a>
        `;

        const recoverButton = canRecover ? `
          <button class="btn btn-sm btn-warning" onclick="recoverPurchase('${purchase.payment_transaction_id}', false)">
            ♻️ Recover
          </button>
          <button class="btn btn-sm btn-danger" onclick="recoverPurchase('${purchase.payment_transaction_id}', true)">
            ⚡ Force Mint
          </button>
        ` : '';

        card.innerHTML = `
          <div class="purchase-header">
            <div>
              <strong>Purchase #${purchase.id}</strong>
            </div>
            <span class="purchase-status ${statusClass}">${statusEmoji} ${purchase.status.toUpperCase()}</span>
          </div>

          <div class="purchase-details">
            <div class="detail-item">
              <span class="detail-label">Wallet</span>
              <span class="detail-value">${purchase.wallet_account}</span>
            </div>
            <div class="detail-item">
              <span class="detail-label">Template ID</span>
              <span class="detail-value">${purchase.template_id}</span>
            </div>
            <div class="detail-item">
              <span class="detail-label">Price</span>
              <span class="detail-value">${purchase.price_wax}</span>
            </div>
            <div class="detail-item">
              <span class="detail-label">Verification Status</span>
              <span class="detail-value">${purchase.verification_status || 'N/A'}</span>
            </div>
            <div class="detail-item">
              <span class="detail-label">Purchased At</span>
              <span class="detail-value">${formatDate(purchase.purchased_at)}</span>
            </div>
            <div class="detail-item">
              <span class="detail-label">Payment TX</span>
              <span class="detail-value" style="font-size: 0.75rem;">${purchase.payment_transaction_id.substring(0, 16)}...</span>
            </div>
          </div>

          ${errorMsg}

          <div class="purchase-actions">
            ${paymentLink}
            ${mintLink}
            ${recoverButton}
          </div>
        `;

        container.appendChild(card);
      });
    }

    // Recover purchase
    async function recoverPurchase(paymentTxId, forceSkipVerification = false) {
      if (!confirm(`Are you sure you want to recover this purchase${forceSkipVerification ? ' (FORCE MINT without verification)' : ''}?`)) {
        return;
      }

      try {
        const response = await fetch(`${API_URL}/api/admin/purchases/recover`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            payment_transaction_id: paymentTxId,
            skip_verification: forceSkipVerification
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Recovery failed');
        }

        alert(`✅ Recovery successful!\n\nMint TX: ${data.mint_transaction_id}`);

        // Refresh the appropriate list
        const activeTab = document.querySelector('.tab.active').dataset.tab;
        if (activeTab === 'recovery') {
          await loadRecoveryPurchases();
        } else {
          await loadPurchases();
        }
      } catch (error) {
        console.error('Recovery error:', error);
        alert('Recovery failed: ' + error.message);
      }
    }

    // Filter purchases
    function filterPurchases() {
      const statusFilter = document.getElementById('statusFilter').value;
      const walletSearch = document.getElementById('walletSearch').value.toLowerCase();

      let filtered = allPurchases;

      if (statusFilter !== 'all') {
        filtered = filtered.filter(p => p.status === statusFilter);
      }

      if (walletSearch) {
        filtered = filtered.filter(p => p.wallet_account.toLowerCase().includes(walletSearch));
      }

      displayPurchases(filtered);
    }

    // Format date
    function formatDate(dateString) {
      const date = new Date(dateString);
      return date.toLocaleString('en-US', {
        year: 'numeric',
        month: 'short',
        day: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
      });
    }

    // Event listeners
    document.getElementById('statusFilter').addEventListener('change', filterPurchases);
    document.getElementById('walletSearch').addEventListener('input', filterPurchases);
    document.getElementById('refreshBtn').addEventListener('click', loadPurchases);

    // Initialize
    checkAdmin();
  </script>
</body>
</html>
