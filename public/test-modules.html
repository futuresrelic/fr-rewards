<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Module System Test - FR Rewards</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="container" style="max-width: 1000px; margin: 2rem auto; padding: 0 2rem;">
    <header style="margin-bottom: 2rem;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
        <h1>🧪 Module System Test</h1>
        <a href="/site-builder.html" class="btn btn-primary">🛠️ Open Site Builder</a>
      </div>
      <p style="color: var(--text-secondary);">Testing the modular architecture before extracting real features</p>
    </header>

    <div class="card" style="margin-bottom: 2rem;">
      <h2>Test Module #1 (No Config)</h2>
      <div id="test1" data-module="test-module"></div>
    </div>

    <div class="card" style="margin-bottom: 2rem;">
      <h2>Test Module #2 (With Config)</h2>
      <div id="test2" data-module="test-module" data-config='{"test_message": "Hello from config!"}'></div>
    </div>

    <div class="card" style="margin-bottom: 2rem;">
      <h2>Transfer Mode Module</h2>
      <div id="transfer-test" data-module="transfer-mode" data-config='{"collection": "futuresrelic"}'></div>
    </div>

    <div class="card">
      <h2>Manual Module Load Test</h2>
      <button id="manual-load-btn" class="btn btn-primary">Load Module Manually</button>
      <div id="manual-container" style="margin-top: 20px;"></div>
    </div>
  </div>

  <!-- Load Module Loader -->
  <script src="/modules/module-loader.js"></script>

  <!-- Manual Load Test -->
  <script>
    document.getElementById('manual-load-btn').addEventListener('click', async () => {
      const container = document.getElementById('manual-container');
      container.id = 'test-manual';
      container.setAttribute('data-module', 'test-module');
      container.setAttribute('data-config', '{"test_message": "Manually loaded!"}');

      await ModuleLoader.loadModule('test-module', 'test-manual', {
        test_message: 'Manually loaded!'
      });
    });
  </script>
</body>
</html>
