<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Factory - Craft Items</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>🏭 Factory - Craft Items</h1>
      <p class="subtitle">Combine ingredients to create new items</p>
    </header>

    <div id="login-section" class="card" style="text-align: center;">
      <h2>Connect Your Wallet</h2>
      <button id="login-btn" class="btn btn-primary btn-lg">Connect WAX Wallet</button>
    </div>

    <div id="factory-content" style="display: none;">
      <div class="user-header">
        <div class="user-info">
          <span class="label">Connected:</span>
          <span id="connected-wallet" class="value"></span>
        </div>
        <div style="display: flex; gap: 10px;">
          <button id="retry-failed-btn" class="btn btn-secondary btn-sm">🔄 Retry Failed Crafts</button>
          <button id="disconnect-btn" class="btn btn-secondary btn-sm">Disconnect</button>
        </div>
      </div>

      <div id="loading-recipes" style="text-align: center; padding: 40px;">
        <p>Loading recipes...</p>
      </div>

      <div id="recipes-container" style="display: none;">
        <!-- Recipes will be loaded here -->
      </div>

      <div id="no-recipes" style="display: none; text-align: center; padding: 40px; color: var(--text-secondary);">
        <p>No recipes available yet. Check back soon!</p>
      </div>
    </div>
  </div>

  <!-- Asset Selection Modal -->
  <div id="asset-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; overflow-y: auto; padding: 20px;">
    <div class="card" style="max-width: 900px; margin: 40px auto; position: relative;">
      <button id="close-modal" style="position: absolute; top: 20px; right: 20px; background: var(--bg-card-hover); border: none; color: white; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-size: 1.2rem;">×</button>

      <h2 id="modal-title">Select Assets</h2>
      <div id="modal-content">
        <!-- Content will be populated dynamically -->
      </div>
    </div>
  </div>

  <!-- Processing Modal -->
  <div id="processing-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1001;">
    <div style="display: flex; align-items: center; justify-content: center; height: 100%;">
      <div class="card" style="max-width: 500px; text-align: center;">
        <h2 id="processing-title">Processing...</h2>
        <div id="processing-content" style="padding: 20px;">
          <!-- Progress steps -->
        </div>
      </div>
    </div>
  </div>

  <!-- Official WaxJS Library (local copy) -->
  <script src="waxjs.js"></script>
  <script src="factory.js"></script>
</body>
</html>
