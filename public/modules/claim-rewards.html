<div class="module-container claim-rewards-module">
  <!-- Not Connected State -->
  <div class="claim-not-connected" style="display: block;">
    <h3>Connect Your Wallet</h3>
    <p style="margin-bottom: 20px;">Connect your WAX wallet to check eligibility and claim rewards.</p>

    <div class="wallet-buttons" style="display: flex; gap: 15px; flex-wrap: wrap; justify-content: center;">
      <button class="claim-connect-wcw btn btn-primary">
        <span class="btn-icon">☁️</span>
        Wax Cloud Wallet
      </button>
      <button class="claim-connect-anchor btn btn-primary">
        <span class="btn-icon">⚓</span>
        Anchor Wallet
      </button>
    </div>
  </div>

  <!-- Loading State -->
  <div class="claim-loading" style="display: none; text-align: center; padding: 40px;">
    <div class="loader" style="margin: 0 auto 15px;"></div>
    <p>Checking your NFT holdings...</p>
  </div>

  <!-- Eligible State -->
  <div class="claim-eligible" style="display: none;">
    <div class="status-badge success" style="margin-bottom: 20px;">
      <span class="badge-icon">✅</span>
      <span>You are eligible!</span>
    </div>

    <div class="claim-wallet-info" style="margin-bottom: 20px; text-align: center;">
      <span style="color: var(--text-secondary);">Connected: </span>
      <span class="claim-connected-account" style="font-weight: 600; color: var(--primary);"></span>
      <button class="claim-disconnect-btn btn btn-secondary btn-sm" style="margin-left: 15px;">Disconnect</button>
    </div>

    <!-- Claim All Button -->
    <div class="claim-all-container" style="margin: 20px 0; text-align: center; display: none;">
      <button class="claim-all-btn btn btn-success" style="font-size: 1.1rem; padding: 12px 24px;">
        🎁 Claim All Available Rewards
      </button>
      <div class="claim-all-status" style="margin-top: 10px; font-size: 0.9rem;"></div>
    </div>

    <div class="claim-nft-list"></div>

    <!-- Claim History -->
    <div class="claim-history" style="display: none; margin-top: 30px;">
      <h4>Recent Claims</h4>
      <div class="claim-history-list"></div>
    </div>
  </div>

  <!-- Not Eligible State -->
  <div class="claim-not-eligible" style="display: none;">
    <div class="status-badge error" style="margin-bottom: 20px;">
      <span class="badge-icon">❌</span>
      <span>No eligible NFTs found</span>
    </div>

    <p style="margin-bottom: 15px;">You need to hold one of these NFT templates:</p>
    <div class="claim-whitelist-info"></div>
  </div>

  <!-- Error State -->
  <div class="claim-error" style="display: none; padding: 20px; background: rgba(239, 68, 68, 0.1); border-radius: 8px; color: var(--error);"></div>
</div>
