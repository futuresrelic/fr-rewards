<div class="module-container factory-craft-module">
  <!-- Not Connected State -->
  <div class="factory-not-connected" style="display: block; text-align: center;">
    <h3>Connect Your Wallet</h3>
    <p style="margin-bottom: 20px;">Connect your WAX wallet to view crafting recipes.</p>

    <div class="wallet-buttons" style="display: flex; gap: 15px; flex-wrap: wrap; justify-content: center;">
      <button class="factory-connect-wcw btn btn-primary">
        <span class="btn-icon">☁️</span>
        Wax Cloud Wallet
      </button>
      <button class="factory-connect-anchor btn btn-primary">
        <span class="btn-icon">⚓</span>
        Anchor Wallet
      </button>
    </div>
  </div>

  <!-- Connected State -->
  <div class="factory-connected" style="display: none;">
    <div class="factory-wallet-info" style="margin-bottom: 20px; text-align: center;">
      <span style="color: var(--text-secondary);">Connected: </span>
      <span class="factory-connected-account" style="font-weight: 600; color: var(--primary);"></span>
      <button class="factory-disconnect-btn btn btn-secondary btn-sm" style="margin-left: 15px;">Disconnect</button>
    </div>

    <!-- Loading Recipes -->
    <div class="factory-loading" style="display: block; text-align: center; padding: 40px;">
      <div class="loader" style="margin: 0 auto 15px;"></div>
      <p>Loading recipes...</p>
    </div>

    <!-- Recipes Container -->
    <div class="factory-recipes-container" style="display: none;">
      <!-- Categories and recipes will be loaded here -->
    </div>

    <!-- No Recipes State -->
    <div class="factory-no-recipes" style="display: none; text-align: center; padding: 40px; color: var(--text-secondary);">
      <p>No recipes available yet. Check back soon!</p>
    </div>
  </div>

  <!-- Error State -->
  <div class="factory-error" style="display: none; padding: 20px; background: rgba(239, 68, 68, 0.1); border-radius: 8px; color: var(--error);"></div>

  <!-- Asset Selection Modal -->
  <div class="factory-asset-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; overflow-y: auto; padding: 20px;">
    <div class="card" style="max-width: 900px; margin: 40px auto; position: relative;">
      <button class="factory-close-modal" style="position: absolute; top: 20px; right: 20px; background: var(--bg-card-hover); border: none; color: white; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-size: 1.2rem;">×</button>

      <h2 class="factory-modal-title">Select Assets</h2>
      <div class="factory-modal-content">
        <!-- Content will be populated dynamically -->
      </div>
    </div>
  </div>

  <!-- Processing Modal -->
  <div class="factory-processing-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1001;">
    <div style="display: flex; align-items: center; justify-content: center; height: 100%;">
      <div class="card" style="max-width: 500px; text-align: center;">
        <h2 class="factory-processing-title">Processing...</h2>
        <div class="factory-processing-content" style="padding: 20px;">
          <!-- Progress steps -->
        </div>
      </div>
    </div>
  </div>
</div>
